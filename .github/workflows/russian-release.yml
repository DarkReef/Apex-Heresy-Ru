name: Russian fork release
on:
  workflow_dispatch:
  push:
    tags: ['v*-ru']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run localization:build
      - run: git diff --exit-code -- lang localization script/localization
      - run: npm test
      - name: Build root-level Foundry archive
        run: |
          node tools/build-release.mjs "$RUNNER_TEMP/apex-stage"
          cd "$RUNNER_TEMP/apex-stage"
          zip -r "$GITHUB_WORKSPACE/apex-heresy-ru.zip" .
      - name: Prepare release for archive verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('system.json')).version")
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            [[ "$GITHUB_REF_NAME" == "v${VERSION}-ru" ]] || exit 1
          fi
          test -f "docs/release-${VERSION}.md"
          if gh release view "v${VERSION}-ru" >/dev/null 2>&1; then
            echo "Release already exists; verified assets are not overwritten."
            exit 0
          fi
          gh release create "v${VERSION}-ru" apex-heresy-ru.zip system.json tools/Move-ApexWorld.ps1 --target "$GITHUB_SHA" --title "Apex Heresy RU ${VERSION}" --draft --notes-file "docs/release-${VERSION}.md"
